global
    log /dev/log local0 info
    maxconn 4096
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  log-health-checks      # 记录健康检查的状态变化，用于算检出时间
    option  dontlognull
    retries 0
    timeout connect 500ms
    timeout client  5s
    timeout server  5s

frontend fe
    bind 127.0.0.1:8080            # 业务入口，与原 lbd 同端口
    default_backend enrolld

backend enrolld
    balance roundrobin
    option httpchk GET /readyz     # 主动健康检查：周期请求 /readyz
    timeout check 500ms            # 对应 lbd 的 -check-timeout
    default-server inter 1s fall 3 rise 2   # 对应 lbd 的 -check-interval / -fall / -rise
    server s1 127.0.0.1:8101 check
    server s2 127.0.0.1:8102 check
    server s3 127.0.0.1:8103 check
