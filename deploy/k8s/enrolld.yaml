apiVersion: v1
kind: Service
metadata:
  name: enrolld
spec:
  type: NodePort
  selector:
    app: enrolld
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrolld
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enrolld
  template:
    metadata:
      labels:
        app: enrolld
    spec:
      containers:
      - name: enrolld
        image: enrolld:o4
        imagePullPolicy: IfNotPresent
        args: ["-addr", "0.0.0.0:8081", "-work", "1000000", "-warmup", "60s", "-data", "/data"]
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enrolld
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enrolld
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
